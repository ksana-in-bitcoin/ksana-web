<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Ksana block explorer and web wallet: confirmed in an instant on Ksana, written into Bitcoin for good." />
    <meta name="theme-color" content="#f1f4f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1314" media="(prefers-color-scheme: dark)" />
    <!-- A theme chosen on the page (src/app/prefs.ts) is applied here, before the first paint, and to the browser's bars: the page's
         scripts apply it only once they have downloaded, and the system's scheme showed until then. Each bar keeps its own colour in
         data-color, for applyTheme -->
    <script>
      (function () {
        try {
          var theme = JSON.parse(localStorage.getItem('ksana:theme'));
          if (theme === 'light' || theme === 'dark') {
            document.documentElement.dataset.theme = theme;
            var bars = document.querySelectorAll('meta[name="theme-color"]');
            var color = null;
            for (var i = 0; i < bars.length; i++) if ((bars[i].getAttribute('media') || '').indexOf(theme) >= 0) color = bars[i].content;
            for (var j = 0; j < bars.length; j++) {
              bars[j].dataset.color = bars[j].content;
              if (color) bars[j].content = color;
            }
          }
        } catch (e) {}
      })();
    </script>
    <!-- What the frame says when the page cannot open (the notes are under it, in the body): its script could not be downloaded, or could
         not run in this browser, or is still loading after 15 seconds. The frame showed its lines for ever then. Once the page has drawn
         itself the frame is gone, and this says nothing -->
    <script>
      (function () {
        var said = '';
        function say(kind) {
          if (document.readyState === 'loading') return document.addEventListener('DOMContentLoaded', function () { say(kind); });
          var frame = document.getElementById('boot');
          var notes = document.getElementById('boot-notes');
          if (!frame || !notes || said === kind || said === 'fetch' || said === 'run') return;
          var old = document.getElementById('boot-note');
          if (old) old.parentNode.removeChild(old);
          var note = document.createElement('div');
          note.id = 'boot-note';
          note.className = 'stack';
          note.setAttribute('role', kind === 'slow' ? 'status' : 'alert');
          note.appendChild(notes.content.querySelector('[data-note="' + kind + '"]').cloneNode(true));
          var row = notes.content.querySelector('.row').cloneNode(true);
          row.querySelector('button').addEventListener('click', function () { location.reload(); });
          note.appendChild(row);
          if (kind === 'slow') frame.setAttribute('aria-busy', 'false');
          else {
            // Nothing more is coming: the lines give way to the note
            frame.removeAttribute('aria-busy');
            while (frame.firstChild) frame.removeChild(frame.firstChild);
          }
          frame.appendChild(note);
          said = kind;
        }
        // An error at the page's script itself is a download that failed; one from inside it, a script this browser could not run
        addEventListener('error', function (e) {
          var own = document.querySelector('script[type="module"][src]');
          if (e.target && e.target.tagName === 'SCRIPT' && e.target.type === 'module') say('fetch');
          else if (own && e.filename === own.src) say('run');
        }, true);
        setTimeout(function () { say('slow'); }, 15000);
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- A phone's home screen and Safari's tiles take a picture, not the SVG: the project site's icon (ksana-site's src/img/apple-touch-icon.png,
         drawn by its scripts/make-images.mjs), named Ksana rather than by the page that was open -->
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Ksana" />
    <!-- The heading font's Latin file, asked for with the page so that the wordmark is drawn in it from the first paint (the single-file
         preview carries its fonts in its stylesheet and is built without this line, vite.config.ts) -->
    <link rel="preload" href="./src/assets/fonts/ksana-serif-latin.woff2" as="font" type="font/woff2" crossorigin />
    <title>Ksana</title>
    <!-- The page renders once it has read deployment.json (src/app/deployment.ts): it asks for the file here, while its scripts download -->
    <script>
      window.__ksanaDeployment = fetch('deployment.json', { cache: 'no-cache' });
      window.__ksanaDeployment.catch(function () {});
    </script>
    <noscript><style>#boot { display: none; }</style></noscript>
  </head>
  <body>
    <div id="root">

           lines (Connecting in src/app/App.tsx), in no language. A phone on a slow link saw an empty page for a second -->
      <header class="topbar">
        <div class="topbar-inner">
          <span class="topbar-brand">
            <span class="wordmark">

L 12.38 24.75 L 13.02 25.01 L 13.67 25.22 L 14.35 25.38 A 1.48 1.48 0 0 1 13.83 28.29 Z" fill="var(--ink)" /><rect x="16.66" y="23.24" width="6.2" height="6.2" rx="0.8" fill="var(--zhu)" transform="rotate(-8 19.76 26.34)" /></svg>
              <span class="wordmark-text">Ksana</span>
            </span>
          </span>
        </div>
      </header>
      <main class="app-main app-main--waiting">
        <div class="page narrow-page" id="boot" aria-busy="true">
          <div class="page-head" aria-hidden="true">
            <div class="page-head-main">
              <div class="eyebrow page-eyebrow">&nbsp;</div>
              <div class="page-title">&nbsp;</div>
              <div class="page-meta">&nbsp;</div>
            </div>
          </div>
          <div class="skeleton-lines" aria-hidden="true"><span></span><span></span><span></span></div>
        </div>
        <!-- Outside the busy frame, which a screen reader may hold back -->
        <noscript>
          <div class="page narrow-page"><p class="prose">This page reads the chain in your browser, and needs JavaScript to do so.</p></div>
        </noscript>
        <!-- What the frame says when the page cannot open (the second script in the head), in English: the page's language until it has
             loaded the reader's -->
        <template id="boot-notes">
          <p class="prose" data-note="fetch">The page could not be downloaded. Check the connection, then reload it.</p>
          <p class="prose" data-note="run">This browser could not run the page. Reload it, and if it still does not open, update the browser or use another one.</p>
          <p class="prose" data-note="slow">The page is still loading. If it does not open, check the connection and reload it.</p>
          <div class="row wrap"><button type="button" class="btn btn--primary btn--md"><span>Reload</span></button></div>
        </template>
      </main>
    </div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
